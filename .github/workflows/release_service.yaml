name: Release Service and Extensions

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version for the project"
        required: true 
        type: string
  push:
    tags:
      - 'v*.*.*-service*' # Push events to matching v*, i.e. v20.15.10


permissions:
  contents: write 
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CLEAN_VERSION: 'v0.0.0'
  TAG_SUFFIX: 'latest'
      
jobs:
  build:
    strategy:
      matrix:
        include:
          - RID: linux-x64
            os: ubuntu-latest
          - RID: win-x64
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
    # Initial setups
    - name: Strip prefix 'v' and suffix '-service'
      shell: bash
      run: |
        TAG="${{ github.ref_name }}"
        WITHOUT_PREFIX=${TAG#v}
        VERSION=${WITHOUT_PREFIX%%-service*}

        # Check if '-service-' exists in the tag
        if [[ "$TAG" == *"-service-"* ]]; then
          # ${TAG##*-service-} removes everything up to the last '-service-'
          SUFFIX="${TAG##*-service-}"
          echo "TAG_SUFFIX=$SUFFIX" >> $GITHUB_ENV
        fi
        
        echo "CLEAN_VERSION=$VERSION" >> $GITHUB_ENV

    - name: Checkout Source Code
      uses: actions/checkout@v6

    - name: Set project versions
      id: update
      uses: vers-one/dotnet-project-version-updater@v1.8
      with:
        file: |
          "extension/Arma3WebService/Arma3WebService.csproj", "extension/DiscordMessageAPIService/DiscordMessageAPIService.csproj"
        version: ${{ env.CLEAN_VERSION }}

    # Setup .NET
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5.3.0
      with:
        dotnet-version: '9.0.x'

    # Ubuntu runners already have clang and zlib, but this ensures they exist
    - name: Install Prerequisites
      if: ${{ matrix.os == 'ubuntu-latest' }} 
      run: |
        sudo apt-get update
        sudo apt-get install -y clang zlib1g-dev

    - name: Decode Extension Signing Certificate (Windows)
      if: ${{ matrix.os == 'windows-latest' }} 
      working-directory: Signing
      shell: pwsh
      id: signCert
      run: |
        $SecurePassword = ConvertTo-SecureString("${{ secrets.SIGNING_PASSWORD }}") -AsPlainText -Force
        & ./Main.ps1 -pfxName "${{ secrets.SIGNING_CERT_NAME }}" -certPassword $SecurePassword -certBase64 "${{ secrets.SIGNING_CERT }}"
        
        # Move public key to dist into artifacts
        $publicKey = (Resolve-Path "../include/z/publicKey.hpp").Path
        $dist = "../dist/z"
        if (-not (Test-Path $dist))
        {
          New-Item -ItemType Directory -Path $dist | Out-Null
        }
        Move-Item -Path $publicKey -Destination $dist
        Write-Host "Moved public key to dist directory." -ForegroundColor Green

    # Building binaries
    - name: Publish with Crossgen2
      shell: bash
      run: |
        PFX_PATH="${{ github.workspace }}/Signing/${{ secrets.SIGNING_CERT_NAME }}"
        PFX_PASSWORD="${{ secrets.SIGNING_PASSWORD }}"
        
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          export PfxPath="$PFX_PATH"
          export PfxPassword="$PFX_PASSWORD"
        fi

        dotnet publish extension/DiscordMessageAPI/DiscordMessageAPI.csproj -c Release -r ${{ matrix.RID }} -o ./dist/extension/${{ matrix.RID }} --self-contained
        dotnet publish extension/DiscordMessageAPIService/DiscordMessageAPIService.csproj  -c Release -r ${{ matrix.RID }} -o ./dist/extension/${{ matrix.RID }} --self-contained
        dotnet publish extension/Arma3WebService/Arma3WebService.csproj --self-contained \
        -c Release \
        -o ./dist/service/${{ matrix.RID }} \
        -r ${{ matrix.RID }} \
        -p:PublishReadyToRun=true \
        -p:PublishReadyToRunComposite=false \
        -p:PublishSingleFile=true \
        -p:TieredCompilation=true

        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          pwsh -ExecutionPolicy Bypass -File "./Signing/Signing.ps1" \
            -pfxPath "${{ github.workspace }}/Signing/${{ secrets.SIGNING_CERT_NAME }}" \
            -certPassword "${{ secrets.SIGNING_PASSWORD }}" \
            -extension "${{ github.workspace }}/dist/extension/${{ matrix.RID }}"
        fi

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: artifact.${{ matrix.RID }}
        path: dist
        include-hidden-files: true
  
  release:
    needs: build
    runs-on: ubuntu-latest

    outputs:
      CLEAN_VERSION: ${{ steps.get-version.outputs.CLEAN_VERSION }}
      TAG_SUFFIX: ${{ steps.get-version.outputs.TAG_SUFFIX }}
      UPLOAD_URL: ${{ steps.do-release.outputs.upload_url }}
      CHECK_TAG: ${{ steps.check-tag.outputs.tag }}

    steps:
    - name: Strip prefix 'v' and suffix '-service'
      id: get-version
      shell: bash
      run: |
        TAG="${{ github.ref_name }}"
        WITHOUT_PREFIX=${TAG#v}
        VERSION=${WITHOUT_PREFIX%%-service*}

        # Check if '-service-' exists in the tag
        if [[ "$TAG" == *"-service-"* ]]; then
          # ${TAG##*-service-} removes everything up to the last '-service-'
          SUFFIX="${TAG##*-service-}"
          echo "TAG_SUFFIX=$SUFFIX" >> $GITHUB_ENV
          echo "TAG_SUFFIX=$SUFFIX" >> $GITHUB_OUTPUT
        fi
        
        echo "CLEAN_VERSION=$VERSION" >> $GITHUB_ENV
        echo "CLEAN_VERSION=$VERSION" >> $GITHUB_OUTPUT

    - name: Checkout Source Code
      uses: actions/checkout@v6

    # Get all extension artifacts
    - name: Download All Artifacts
      uses: actions/download-artifact@v7
      with:
        path: dist
        pattern: artifact.*
        merge-multiple: true

    - run: ls -R dist

    - name: Zip extension by RID
      working-directory: dist/extension
      run: |
        # Loop through every directory (RID) inside
        for rid_dir in */; do
          # Remove the trailing slash to get the clean RID name (e.g., "linux-x64")
          rid="${rid_dir%/}"
          
          echo "Compressing RID: $rid"
          
          # Zip the directory. Output will be "linux-x64.zip"
          zip -r "extensions.${rid}.zip" "$rid"
        done
      
    - name: Zip service by RID
      working-directory: dist/service
      run: |
        # Loop through every directory (RID) inside
        for rid_dir in */; do
          # Remove the trailing slash to get the clean RID name (e.g., "linux-x64")
          rid="${rid_dir%/}"
          
          echo "Compressing RID: $rid"
          
          # Zip the directory. Output will be "linux-x64.zip"
          zip -r "webService.${rid}.zip" "$rid"
        done

    # Copy service extension
    - name: Copy Service Extension to Addon Directory
      run: |
        # Loop through every directory (RID) inside
        for rid_dir in dist/extension/*/; do

          # Remove the trailing slash to get the clean RID name (e.g., "linux-x64")
          rid="${rid_dir%/}"
          rid="${rid##*/}"
          echo "Copying RID: $rid"

          # Find and Copy *service ".dll" OR ".so" to cwd without overwriting
          find "$rid_dir" -type f \( -name "*service_x64.dll" -o -name "*service_x64.so" \) -exec cp -v -n {} . \;
        done
    
    # Overwrite public key
    - name: Overwrite public key in Include Directory
      run: |
        cp dist/z/publicKey.hpp include/z/publicKey.hpp
        cat include/z/publicKey.hpp

    # Building Addons
    - name: Setup HEMTT
      uses: arma-actions/hemtt@v1

    - name: Run HEMTT release
      run: hemtt release

    - working-directory: releases
      run: |
        mv -v discordapi-latest.zip DiscordAPI-Addons.${{ env.CLEAN_VERSION }}.${{ env.TAG_SUFFIX == '' && 'latest' || env.TAG_SUFFIX }}.zip        

    - name: Publish GitHub Release
      id: do-release
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        name: Release ${{ env.CLEAN_VERSION }} ${{ env.TAG_SUFFIX }}
        tag_name: ${{ github.ref_name }}
        target_commitish: ${{ github.sha }}
        files: |
          dist/extension/*.zip
          dist/service/*.zip
          releases/DiscordAPI-Addons.${{ env.CLEAN_VERSION }}.${{ env.TAG_SUFFIX }}.zip

        prerelease: ${{ env.TAG_SUFFIX != 'latest' }}
        generate_release_notes: true
        draft: true

    - name: Delete Original Downloaded Artifacts
      uses: geekyeggo/delete-artifact@v6
      with:
        name: artifact.* 
        failOnError: false
    
    - name: Set lowercase IMAGE_NAME
      run: |
        echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

    - name: Check if Docker tag exists
      id: check-tag
      uses: tyriis/docker-image-tag-exists@v3.0.1
      with:
        registry: ${{ env.REGISTRY }}
        repository: ${{ env.IMAGE_NAME }}
        tag: v${{ env.CLEAN_VERSION }}
  
  push_image:
    needs: release
    if: ${{ needs.release.outputs.TAG_SUFFIX != 'TEST' && needs.release.outputs.CHECK_TAG == 'not found' }}
    runs-on: ubuntu-latest

    env:
      UPLOAD_URL: ${{ needs.release.outputs.UPLOAD_URL }}
      TAG_SUFFIX: ${{ needs.release.outputs.TAG_SUFFIX }}
      CLEAN_VERSION: ${{ needs.release.outputs.CLEAN_VERSION }}

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v6

    # Push image to github registry
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        # list of Docker images to use as base name for tags
        images: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        # generate Docker tags based on the following events/attributes
        tags: |
          type=raw,value=v${{ env.CLEAN_VERSION }}
          type=raw,value=${{ env.TAG_SUFFIX == '' && 'latest' || env.TAG_SUFFIX }}
      
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build docker image
      uses: docker/build-push-action@v7
      with:
        context: ./extension
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
